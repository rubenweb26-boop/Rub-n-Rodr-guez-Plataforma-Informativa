<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,spline-viewer{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1624} spline-viewer{display:block}</style><script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.72/build/spline-viewer.js"></script></head><body><spline-viewer url="https://prod.spline.design/kciH7Kyt8n6aYzQf/scene.splinecode"></spline-viewer><script>const viewer=document.querySelector('spline-viewer');let sent=false;const ready=()=>{if(!sent){sent=true;parent.postMessage({type:'rubenweb-spline-loaded'},'*')}};viewer.addEventListener('load',ready);viewer.addEventListener('error',()=>parent.postMessage({type:'rubenweb-spline-error'},'*'));const check=setInterval(()=>{const canvas=viewer.shadowRoot?.querySelector('canvas');if(canvas&&canvas.width>300&&canvas.height>150){clearInterval(check);ready()}},250);setTimeout(()=>clearInterval(check),24000);</script></body></html>
