name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan the repository and history for secrets
        run: npm run security:secrets

      - name: Audit dependencies
        run: npm run security:audit

      - name: Lint source
        run: npm run lint

      - name: Build production artifact
        run: npm run build

      - name: Install private application dependencies
        run: |
          npm ci --prefix CRM
          npm ci --prefix backend

      - name: Build CRM and verify private API
        run: |
          npm run build --prefix CRM
          npm test --prefix backend
